<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhận báo giá in ấn – Phúc Thịnh Labels</title>
<meta name="description" content="Gửi yêu cầu in tem nhãn, tờ rơi, name card… để Phúc Thịnh Labels gọi lại báo giá trong 5 phút.">
<link rel="icon" href="Assets/icons/App Logo.jpg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>

<section class="sec"><div class="wrap">
  <h1>Nhận báo giá <em>nhanh</em></h1>
  <p class="lead">Điền thông tin bên dưới, bộ phận tư vấn sẽ gọi lại cho bạn trong vòng 5 phút (giờ làm việc).</p>
  <div class="two">
    <form id="quote" class="panel">
      <label>Họ tên<input name="ten" required autocomplete="name"></label>
      <label>Số điện thoại<input name="sdt" type="tel" inputmode="tel" required pattern="[0-9 +.]{9,16}" autocomplete="tel"></label>
      <label>Loại ấn phẩm<select name="sp" required></select></label>
      <label>Số lượng dự kiến<input name="sl" placeholder="VD: 1.000 cái"></label>
      <label>Yêu cầu thêm<textarea name="nd" rows="4" placeholder="Kích thước, chất liệu, ngày cần giao…"></textarea></label>
      <button class="btn">Gửi yêu cầu</button>
      <p id="msg" role="status"></p>
    </form>
    <aside class="panel side" id="side"></aside>
  </div>
</div></section>
</main>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/bao-gia.js"></script>
</body>
</html>
